services:
  - type: web
    name: discord-owner-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_BACKGROUND_WORKER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
